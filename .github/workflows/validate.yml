name: validate

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '^22.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Run the bun tests
        working-directory: skills/huajar-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun test
      - name: Run the script tests
        run: bun test ./.github/scripts
      - run: npm install --global @anthropic-ai/claude-code@2.1.308
      - run: claude plugin validate .
      - name: Fetch the Reference
        run: |
          git init -q "$RUNNER_TEMP/reference"
          git -C "$RUNNER_TEMP/reference" fetch -q --depth 1 https://github.com/cursor/plugins 9e278fe4d4ecd8bfe98b1b79bf4be662efb338cc
      - name: Check huajar-mode against the Reference
        run: node .github/scripts/check-reference.mjs --reference "$RUNNER_TEMP/reference" --checks reference
      - name: Keep map rows, the model defaults, and the text they copy in step
        run: node .github/scripts/check-reference.mjs --checks map
      - name: Map every Cursor path the shipped text names
        run: node .github/scripts/check-cursor-paths.mjs
      - name: Keep the map under the hook output cap
        run: |
          status=0
          joined=""
          seen=$(mktemp)
          echo '{"attachment":{"hookName":"UserPromptExpansion","content":"# huajar-stack in Claude Code"}}' > "$seen"
          while IFS= read -r cmd; do
            if [ -n "$(echo '{"command_name":"commit"}' | CLAUDE_PLUGIN_ROOT="$PWD" bash -c "$cmd")" ]; then
              echo "::error file=hooks/hooks.json::A command that is no huajar-stack skill printed the map."
              status=1
            fi
            if [ -n "$(echo "{\"command_name\":\"huajar-stack:swarm\",\"transcript_path\":\"$seen\"}" | CLAUDE_PLUGIN_ROOT="$PWD" bash -c "$cmd")" ]; then
              echo "::error file=hooks/hooks.json::A session whose transcript already holds the map printed it again."
              status=1
            fi
            out=$(echo '{"command_name":"huajar-stack:huajar-mode"}' | CLAUDE_PLUGIN_ROOT="$PWD" bash -c "$cmd" | tr -d '\r'; printf x)
            out=${out%x}
            chars=$(printf '%s' "$out" | wc -m)
            echo "hook output: $chars characters"
            if [ "$chars" -gt 9000 ]; then
              echo "::error file=hooks/hooks.json::$chars characters, over 9,000. Claude Code replaces hook output over 10,000 characters with a preview."
              status=1
            fi
            joined+="$out"
          done < <(jq -r '.hooks.UserPromptExpansion[].hooks[].command' hooks/hooks.json)
          expected=$(tr -d '\r' < docs/harness/claude-code.md; printf x)
          if [ "$joined"x != "$expected" ]; then
            echo "::error file=hooks/hooks.json::The hook outputs joined in order differ from docs/harness/claude-code.md, so a row is not printed. Check that the split heading still exists."
            status=1
          fi
          exit "$status"
      - name: Keep herdr 0.9 commands out of the docs
        run: |
          paths=(skills docs/guide docs/harness CONTEXT.md README.md)
          find "${paths[@]}" -type f | sort
          status=0
          matches=$(grep -rnE 'herdr (agent|pane|worktree|workspace)|HERDR_ENV' "${paths[@]}") || status=$?
          if [ "$status" -eq 1 ]; then
            echo "No herdr 0.9 command found."
            exit 0
          fi
          if [ "$status" -eq 0 ]; then
            while IFS=: read -r file line text; do
              echo "::error file=$file,line=$line::herdr 0.9 command. Use the Herdr app and hc, per skills/huajar-mode/references/seats.md: $text"
            done <<< "$matches"
          fi
          exit 1
      - name: Name the session id the shell sets
        run: |
          matches=$(grep -rnF --exclude=SKILL.md '${CLAUDE_SESSION_ID}' skills agents docs/guide || true)
          if [ -z "$matches" ]; then
            echo 'No ${CLAUDE_SESSION_ID} outside SKILL.md.'
            exit 0
          fi
          while IFS=: read -r file line text; do
            echo "::error file=$file,line=$line::Claude Code fills \${CLAUDE_SESSION_ID} only in a skill it loads. Use \$CLAUDE_CODE_SESSION_ID, which the shell sets: $text"
          done <<< "$matches"
          exit 1
      - name: Keep space labels off the terminals the plugin starts
        run: |
          paths=(skills agents docs/guide docs/harness CONTEXT.md README.md)
          status=0
          matches=$(grep -rnE -- "--label[= ]['\"]?herdr\.(space|tab)" "${paths[@]}") || status=$?
          if [ "$status" -eq 1 ]; then
            echo "No space label found."
            exit 0
          fi
          if [ "$status" -eq 0 ]; then
            while IFS=: read -r file line text; do
              echo "::error file=$file,line=$line::space label on a started terminal. Seats show once as sub-agents, per step 4 of skills/huajar-mode/references/seats.md: $text"
            done <<< "$matches"
          fi
          exit 1
